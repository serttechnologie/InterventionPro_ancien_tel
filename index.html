<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InterventionPro v9 - Compatible + Compression</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root { --bg:#05070a; --card:#12161f; --accent:#ff6b2b; --text:#ffffff; --green:#00ff88; --red:#ff5050; --border:rgba(255,255,255,0.08); }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
   .hdr{position:sticky;top:0;z-index:100;background:rgba(5,7,10,0.9);padding:14px 20px;border-bottom:1px solid var(--border);}
   .logo{font-weight:800;font-size:1.15rem;}
   .logo-accent{color:var(--accent);}
   .view{display:none;padding:20px;max-width:580px;margin:0 auto;}
   .view.active{display:block;}
   .btn{border:none;border-radius:12px;font-weight:700;cursor:pointer;padding:16px 22px;width:100%;font-family:inherit;margin:5px 0;}
   .btn:active{transform:scale(0.98);}
   .btn-primary{background:var(--accent);color:#fff;}
   .btn-secondary{background:var(--card);border:1px solid var(--border);color:#fff;}
   .btn-danger{background:rgba(255,80,80,0.15);color:var(--red);}
   .btn-green{background:rgba(0,255,136,0.15);color:var(--green);}
   .int-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;}
   .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
   .photo-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);position:relative;border:1px solid var(--border);}
   .photo-item img{width:100%;height:100%;object-fit:cover;}
   .photo-del{position:absolute;top:5px;right:5px;background:#ff5050;color:white;border:none;width:26px;height:26px;border-radius:50%;font-weight:bold;}
   .banner{border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:0.85rem;background:rgba(255,107,43,0.1);border:1px solid rgba(255,107,43,0.2);color:var(--accent);}
   .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center;padding:20px;}
   .modal{background:var(--card);width:100%;max-width:400px;padding:25px;border-radius:20px;}
    input{width:100%;padding:12px;margin:10px 0;background:#1a1f2b;border:1px solid var(--border);color:#fff;border-radius:10px;}
   .storage{font-size:0.75rem;opacity:0.7;margin-top:5px;}
  </style>
</head>
<body>
  <div class="hdr">
    <div class="logo">📸 Inter<span class="logo-accent">Pro</span></div>
  </div>
  <div class="view active" id="v-list">
    <button class="btn btn-primary" id="btn-new">+ Nouvelle intervention</button>
    <div id="mode-banner" class="banner"></div>
    <div id="list-container"></div>
  </div>
  <div class="view" id="v-detail">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px;">
      <button class="btn btn-secondary" id="btn-back" style="width:auto;padding:12px">←</button>
      <div style="flex:1;">
        <div id="d-num" style="color:var(--accent);font-weight:700;font-size:0.7rem;"></div>
        <div id="d-title" style="font-weight:800;font-size:1rem;"></div>
        <div id="d-storage" class="storage"></div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-photo">📷 PRENDRE UNE PHOTO</button>
    <button class="btn btn-green" id="btn-export-zip">💾 Exporter en.zip</button>
    <button class="btn btn-danger" id="btn-export-clear">🗑 Exporter et vider</button>
    <div id="grid" class="photo-grid" style="margin-top:20px;"></div>
    <input type="file" id="camera-input" accept="image/jpeg,image/png" capture="environment" style="display:none"/>
  </div>
  <div class="overlay" id="m-create">
    <div class="modal">
      <h3>Nouvelle intervention</h3>
      <input type="text" id="in-num" placeholder="Numéro intervention"/>
      <input type="text" id="in-client" placeholder="Nom du client"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn btn-secondary" onclick="hideModals()">Annuler</button>
        <button class="btn btn-primary" id="btn-modal-create">Créer</button>
      </div>
    </div>
  </div>
<script>
let db;
let interventions = JSON.parse(localStorage.getItem('ipro_v9') || '[]');
let currentId = null;
const request = indexedDB.open('InterProDB', 2);
request.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains('photos')) {
    db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
  }
};
request.onsuccess = e => {
  db = e.target.result;
  updateStorageInfo();
  renderList();
};
document.getElementById('mode-banner').textContent = 'Mode Compatible : photos compressées et stockées dans l\'app. Exporte régulièrement.';
document.getElementById('btn-new').onclick = () => showModal('m-create');
document.getElementById('btn-back').onclick = goHome;
document.getElementById('btn-modal-create').onclick = createIntervention;
document.getElementById('btn-export-zip').onclick = () => exportPhotos(false);
document.getElementById('btn-export-clear').onclick = () => exportPhotos(true);
const camInput = document.getElementById('camera-input');
document.getElementById('btn-photo').onclick = () => camInput.click();
camInput.onchange = async (e) => {
  const file = e.target.files[0];
  if(!file ||!currentId) return;
  // COMPRESSION : 1600px max, qualité 0.8
  const compressedData = await compressImage(file, 1600, 0.8);
  const tx = db.transaction('photos', 'readwrite');
  tx.objectStore('photos').add({
    interventionId: currentId,
    name: `IMG_${Date.now()}.jpg`,
    data: compressedData,
    size: Math.round(compressedData.length * 0.75) // taille approx en bytes
  });
  tx.oncomplete = () => {
    const inv = interventions.find(i => i.id === currentId);
    inv.photoCount++;
    save();
    loadPhotos(currentId);
    updateStorageInfo();
  };
  e.target.value = '';
};
function compressImage(file, maxWidth, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = height * (maxWidth / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function loadPhotos(id) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const tx = db.transaction('photos', 'readonly');
  const req = tx.objectStore('photos').getAll();
  req.onsuccess = () => {
    req.result.filter(p => p.interventionId === id).forEach(photo => {
      const div = document.createElement('div');
      div.className = 'photo-item';
      div.innerHTML = `
        <img src="${photo.data}">
        <button class="photo-del" onclick="deletePhoto(${photo.id})">✕</button>
      `;
      grid.appendChild(div);
    });
  };
}
function deletePhoto(photoId) {
  if(!confirm("Supprimer cette photo?")) return;
  const tx = db.transaction('photos', 'readwrite');
  tx.objectStore('photos').delete(photoId);
  tx.oncomplete = () => {
    const inv = interventions.find(i => i.id === currentId);
    inv.photoCount = Math.max(0, inv.photoCount - 1);
    save();
    loadPhotos(currentId);
    updateStorageInfo();
  };
}
async function exportPhotos(clearAfter) {
  const tx = db.transaction('photos', 'readonly');
  const req = tx.objectStore('photos').getAll();
  req.onsuccess = async () => {
    const photos = req.result.filter(p => p.interventionId === currentId);
    if (photos.length === 0) return alert("Aucune photo à exporter");
    const zip = new JSZip();
    const inv = interventions.find(i => i.id === currentId);
    const folder = zip.folder(`${inv.num}_${inv.client}`.replace(/[^a-z0-9_]/gi, '_'));
    photos.forEach(photo => {
      const base64 = photo.data.split(',')[1];
      folder.file(photo.name, base64, {base64: true});
    });
    const content = await zip.generateAsync({type:"blob"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = `${inv.num}_${inv.client}.zip`;
    a.click();
    if (clearAfter && confirm(`Téléchargement lancé. Supprimer les ${photos.length} photos de l'app pour libérer de la place?`)) {
      const delTx = db.transaction('photos', 'readwrite');
      const store = delTx.objectStore('photos');
      photos.forEach(p => store.delete(p.id));
      delTx.oncomplete = () => {
        inv.photoCount = 0;
        save();
        loadPhotos(currentId);
        updateStorageInfo();
        alert("Photos exportées et app vidée.");
      };
    }
  };
}
function updateStorageInfo() {
  if (!navigator.storage ||!navigator.storage.estimate) return;
  navigator.storage.estimate().then(estimate => {
    const used = (estimate.usage / 1024 / 1024).toFixed(1);
    const quota = (estimate.quota / 1024 / 1024).toFixed(0);
    const percent = ((estimate.usage / estimate.quota) * 100).toFixed(0);
    document.getElementById('d-storage').textContent = `Stockage : ${used} Mo / ${quota} Mo (${percent}%)`;
  });
}
function createIntervention() {
  const num = document.getElementById('in-num').value.trim();
  const cli = document.getElementById('in-client').value.trim();
  if(!num ||!cli) return alert("Remplis numéro et client");
  const inv = { id: Date.now(), num, client: cli, photoCount: 0 };
  interventions.push(inv);
  save();
  hideModals();
  document.getElementById('in-num').value = '';
  document.getElementById('in-client').value = '';
  renderList();
  openFolder(inv.id);
}
function renderList() {
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  interventions.slice().reverse().forEach(inv => {
    const div = document.createElement('div');
    div.className = 'int-card';
    div.onclick = () => openFolder(inv.id);
    div.innerHTML = `<div style="font-weight:700;color:var(--accent);font-size:0.8rem">${escapeHTML(inv.num)}</div>
                     <div>${escapeHTML(inv.client)}</div>
                     <div style="font-size:0.8rem;opacity:0.7">${inv.photoCount} 📷</div>`;
    container.appendChild(div);
  });
}
function openFolder(id) {
  currentId = id;
  const inv = interventions.find(i => i.id === id);
  document.getElementById('d-num').textContent = inv.num;
  document.getElementById('d-title').textContent = inv.client;
  document.getElementById('v-list').classList.remove('active');
  document.getElementById('v-detail').classList.add('active');
  loadPhotos(id);
  updateStorageInfo();
}
function goHome() {
  currentId = null;
  document.getElementById('v-detail').classList.remove('active');
  document.getElementById('v-list').classList.add('active');
  renderList();
}
function escapeHTML(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function save() { localStorage.setItem('ipro_v9', JSON.stringify(interventions)); }
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function hideModals() { document.querySelectorAll('.overlay').forEach(o => o.style.display='none'); }
</script>
</body>
</html>
