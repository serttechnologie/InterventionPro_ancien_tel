<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InterventionPro v10</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #05070a;
      --card: #12161f;
      --card2: #1a1f2b;
      --accent: #ff6b2b;
      --accent2: #ff8f5a;
      --text: #ffffff;
      --muted: rgba(255,255,255,0.5);
      --green: #00e57a;
      --red: #ff5050;
      --blue: #4da6ff;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --drag-over: rgba(255,107,43,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    /* HEADER */
    .hdr {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5,7,10,0.92);
      backdrop-filter: blur(12px);
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
    .logo-accent { color: var(--accent); }
    .gdrive-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 13px;
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .gdrive-btn:hover { background: #222936; border-color: rgba(255,255,255,0.22); }
    .gdrive-btn.connected { border-color: rgba(0,229,122,0.4); color: var(--green); }
    .gdrive-icon { width: 16px; height: 16px; }

    /* VIEWS */
    .view { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
    .view.active { display: block; }

    /* BUTTONS */
    .btn {
      border: none; border-radius: 12px; font-weight: 700;
      cursor: pointer; padding: 14px 20px; width: 100%;
      font-family: inherit; font-size: 0.92rem;
      margin: 5px 0; transition: transform 0.1s, opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-secondary { background: var(--card); border: 1px solid var(--border2); color: var(--text); }
    .btn-secondary:hover { background: var(--card2); }
    .btn-danger { background: rgba(255,80,80,0.12); color: var(--red); border: 1px solid rgba(255,80,80,0.2); }
    .btn-green { background: rgba(0,229,122,0.1); color: var(--green); border: 1px solid rgba(0,229,122,0.2); }
    .btn-blue { background: rgba(77,166,255,0.1); color: var(--blue); border: 1px solid rgba(77,166,255,0.2); }
    .btn-sm { padding: 9px 14px; font-size: 0.82rem; border-radius: 9px; }

    /* INTERVENTION CARDS */
    .int-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 17px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex; align-items: center; gap: 13px;
    }
    .int-card:hover { border-color: var(--border2); background: #14192400; }
    .int-icon {
      width: 42px; height: 42px; border-radius: 11px;
      background: rgba(255,107,43,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .int-info { flex: 1; min-width: 0; }
    .int-num { color: var(--accent); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .int-name { font-weight: 700; font-size: 0.97rem; }
    .int-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    /* PHOTO GRID */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }
    .photo-item {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card);
      position: relative;
      border: 1px solid var(--border);
      cursor: grab;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .photo-item:active { cursor: grabbing; }
    .photo-item.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }
    .photo-item.drag-over {
      border-color: var(--accent);
      background: var(--drag-over);
      transform: scale(1.04);
      box-shadow: 0 0 0 2px rgba(255,107,43,0.4);
    }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .photo-actions {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; gap: 4px; padding: 6px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      opacity: 0; transition: opacity 0.15s;
    }
    .photo-item:hover .photo-actions { opacity: 1; }
    .photo-action-btn {
      flex: 1; border: none; border-radius: 6px; padding: 5px;
      font-size: 0.7rem; font-weight: 700; cursor: pointer;
      transition: background 0.1s;
    }
    .pab-comment { background: rgba(77,166,255,0.85); color: #fff; }
    .pab-delete { background: rgba(255,80,80,0.85); color: #fff; }
    .photo-comment-badge {
      position: absolute; top: 6px; left: 6px;
      background: rgba(77,166,255,0.9);
      color: #fff; font-size: 0.65rem; font-weight: 700;
      padding: 2px 6px; border-radius: 5px;
      pointer-events: none;
    }
    .drag-handle {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.7);
      width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; pointer-events: none;
    }

    /* DETAIL HEADER */
    .detail-hdr {
      display: flex; align-items: center; gap: 13px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .detail-meta { flex: 1; }
    .detail-date { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
    .storage-bar { height: 3px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .storage-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }
    .storage-label { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

    /* EXPORT SECTION */
    .export-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 14px;
    }
    .export-title { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
    .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* MODAL */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000; align-items: center; justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card);
      width: 100%; max-width: 400px;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 16px; }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

    input, textarea {
      width: 100%; padding: 12px 14px;
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      margin: 5px 0;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 90px; }

    /* CAPTION MODAL */
    .caption-preview {
      border-radius: 12px; overflow: hidden; margin-bottom: 14px;
      aspect-ratio: 4/3; background: var(--card2);
    }
    .caption-preview img { width: 100%; height: 100%; object-fit: cover; }

    /* BANNER */
    .banner {
      border-radius: 11px; padding: 11px 15px;
      margin-bottom: 16px; font-size: 0.82rem;
      background: rgba(255,107,43,0.08);
      border: 1px solid rgba(255,107,43,0.18);
      color: var(--accent2);
      display: flex; align-items: center; gap: 8px;
    }

    /* TOAST */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--card2); border: 1px solid var(--border2);
      color: var(--text); padding: 11px 20px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 600;
      z-index: 2000; transition: transform 0.3s ease, opacity 0.3s ease;
      white-space: nowrap; opacity: 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* PROGRESS */
    #progress-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 1500;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    #progress-overlay.open { display: flex; }
    .progress-box { background: var(--card); border-radius: 18px; padding: 28px 32px; text-align: center; min-width: 240px; }
    .progress-bar-wrap { height: 6px; background: var(--border); border-radius: 6px; margin-top: 14px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.2s; }
    .progress-label { font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>

<div class="hdr">
  <div class="logo">📸 Inter<span class="logo-accent">Pro</span></div>
  <button class="gdrive-btn" id="gdrive-btn" onclick="toggleGDrive()">
    <svg class="gdrive-icon" viewBox="0 0 24 24" fill="none">
      <path d="M4.5 19.5L7.5 14H16.5L19.5 19.5H4.5Z" fill="#4285F4"/>
      <path d="M7.5 14L3 7L7.5 0H16.5L12 7L7.5 14Z" fill="#0F9D58"/>
      <path d="M16.5 14L21 7H16.5L12 7L16.5 14Z" fill="#FBBC04"/>
    </svg>
    <span id="gdrive-label">Google Drive</span>
  </button>
</div>

<!-- LIST VIEW -->
<div class="view active" id="v-list">
  <button class="btn btn-primary" id="btn-new">+ Nouvelle intervention</button>
  <div class="banner" id="mode-banner">
    <span>💡</span>
    <span>Photos compressées (max 1600px). Exporter régulièrement pour libérer de l'espace.</span>
  </div>
  <div id="list-container"></div>
</div>

<!-- DETAIL VIEW -->
<div class="view" id="v-detail">
  <div class="detail-hdr">
    <button class="btn btn-secondary btn-sm" id="btn-back" style="width:auto">← Retour</button>
    <div class="detail-meta">
      <div id="d-num" style="color:var(--accent);font-weight:700;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em"></div>
      <div id="d-title" style="font-weight:800;font-size:1rem;"></div>
      <div id="d-date" class="detail-date"></div>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-photo">📷 Prendre / Ajouter une photo</button>

  <div class="export-section">
    <div class="export-title">📤 Exporter</div>
    <div class="export-grid">
      <button class="btn btn-green btn-sm" id="btn-export-zip">💾 ZIP</button>
      <button class="btn btn-blue btn-sm" id="btn-export-pdf">📄 PDF</button>
      <button class="btn btn-secondary btn-sm" id="btn-export-drive">☁️ Drive (ZIP)</button>
      <button class="btn btn-danger btn-sm" id="btn-export-clear">🗑 ZIP + Vider</button>
    </div>
  </div>

  <div class="storage-bar">
    <div class="storage-fill" id="storage-fill" style="width:0%"></div>
  </div>
  <div class="storage-label" id="d-storage">Calcul du stockage…</div>

  <div id="grid" class="photo-grid"></div>
  <input type="file" id="camera-input" accept="image/jpeg,image/png" capture="environment" style="display:none" multiple/>
</div>

<!-- MODAL: NOUVELLE INTERVENTION -->
<div class="overlay" id="m-create">
  <div class="modal">
    <h3>Nouvelle intervention</h3>
    <input type="text" id="in-num" placeholder="Numéro d'intervention (ex: INT-001)"/>
    <input type="text" id="in-client" placeholder="Nom du client"/>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="hideModals()">Annuler</button>
      <button class="btn btn-primary" id="btn-modal-create">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL: COMMENTAIRE PHOTO -->
<div class="overlay" id="m-caption">
  <div class="modal">
    <h3>💬 Commentaire photo</h3>
    <div class="caption-preview"><img id="caption-img-preview" src="" alt="aperçu"/></div>
    <input type="text" id="caption-name" placeholder="Légende (ex: Vue d'ensemble)" style="margin-bottom:4px"/>
    <textarea id="caption-comment" placeholder="Commentaire détaillé (optionnel)…"></textarea>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="hideModals()">Annuler</button>
      <button class="btn btn-primary" id="btn-save-caption">Enregistrer</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- PROGRESS OVERLAY -->
<div id="progress-overlay">
  <div class="progress-box">
    <div id="progress-title" style="font-weight:700;font-size:1rem;">Génération en cours…</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progress-label">Préparation…</div>
  </div>
</div>

<script>
/* ============================================================
   STATE & DB
   ============================================================ */
let db;
let interventions = JSON.parse(localStorage.getItem('ipro_v10') || '[]');
let currentId = null;
let capturePhotoId = null;
let dragSrcId = null;
let gdriveToken = null;
let gdriveConnected = false;

// Google OAuth2 config
const GDRIVE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // Replace with your OAuth2 client ID
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

/* --- IndexedDB init --- */
const dbRequest = indexedDB.open('InterProDB', 3);
dbRequest.onupgradeneeded = e => {
  const d = e.target.result;
  if (!d.objectStoreNames.contains('photos')) {
    const store = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
    store.createIndex('interventionId', 'interventionId', { unique: false });
  }
};
dbRequest.onsuccess = e => {
  db = e.target.result;
  updateStorageInfo();
  renderList();
};
dbRequest.onerror = () => toast('❌ Erreur ouverture base de données');

/* ============================================================
   EVENT BINDINGS
   ============================================================ */
document.getElementById('btn-new').onclick = () => showModal('m-create');
document.getElementById('btn-back').onclick = goHome;
document.getElementById('btn-modal-create').onclick = createIntervention;
document.getElementById('btn-export-zip').onclick = () => exportPhotos('zip', false);
document.getElementById('btn-export-clear').onclick = () => exportPhotos('zip', true);
document.getElementById('btn-export-pdf').onclick = () => exportPhotos('pdf', false);
document.getElementById('btn-export-drive').onclick = () => exportPhotos('drive', false);
document.getElementById('btn-save-caption').onclick = saveCaption;

const camInput = document.getElementById('camera-input');
document.getElementById('btn-photo').onclick = () => camInput.click();
camInput.onchange = handleNewPhotos;

/* ============================================================
   PHOTO CAPTURE & COMPRESSION
   ============================================================ */
async function handleNewPhotos(e) {
  const files = Array.from(e.target.files);
  if (!files.length || !currentId) return;
  showProgress('Ajout des photos…', 0);
  for (let i = 0; i < files.length; i++) {
    setProgress(Math.round((i / files.length) * 100), `Photo ${i+1}/${files.length}…`);
    const data = await compressImage(files[i], 1600, 0.82);
    await addPhotoDB({ interventionId: currentId, name: `IMG_${Date.now()}_${i}.jpg`, data, caption: '', comment: '', order: Date.now() + i });
    const inv = interventions.find(x => x.id === currentId);
    inv.photoCount++;
    save();
  }
  hideProgress();
  loadPhotos(currentId);
  updateStorageInfo();
  e.target.value = '';
}

function compressImage(file, maxWidth, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = h * (maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function addPhotoDB(photo) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').add(photo);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

/* ============================================================
   LOAD & RENDER PHOTOS
   ============================================================ */
function loadPhotos(id) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const tx = db.transaction('photos', 'readonly');
  const req = tx.objectStore('photos').getAll();
  req.onsuccess = () => {
    const photos = req.result
      .filter(p => p.interventionId === id)
      .sort((a, b) => (a.order || a.id) - (b.order || b.id));

    photos.forEach(photo => grid.appendChild(buildPhotoCard(photo)));
  };
}

function buildPhotoCard(photo) {
  const div = document.createElement('div');
  div.className = 'photo-item';
  div.dataset.id = photo.id;
  div.draggable = true;

  div.innerHTML = `
    <img src="${photo.data}" alt="${escapeHTML(photo.caption || '')}">
    ${photo.comment ? `<div class="photo-comment-badge">💬</div>` : ''}
    <div class="drag-handle">⠿</div>
    <div class="photo-actions">
      <button class="photo-action-btn pab-comment" title="Commenter">✏️</button>
      <button class="photo-action-btn pab-delete" title="Supprimer">✕</button>
    </div>
  `;

  div.querySelector('.pab-comment').onclick = (e) => { e.stopPropagation(); openCaptionModal(photo); };
  div.querySelector('.pab-delete').onclick = (e) => { e.stopPropagation(); deletePhoto(photo.id); };

  /* Drag & Drop */
  div.addEventListener('dragstart', onDragStart);
  div.addEventListener('dragover', onDragOver);
  div.addEventListener('drop', onDrop);
  div.addEventListener('dragend', onDragEnd);
  div.addEventListener('dragleave', onDragLeave);

  return div;
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
function onDragStart(e) {
  dragSrcId = parseInt(this.dataset.id);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.photo-item').forEach(el => el.classList.remove('drag-over'));
  if (parseInt(this.dataset.id) !== dragSrcId) this.classList.add('drag-over');
}
function onDragLeave() { this.classList.remove('drag-over'); }
function onDragEnd() {
  document.querySelectorAll('.photo-item').forEach(el => {
    el.classList.remove('dragging', 'drag-over');
  });
  dragSrcId = null;
}
async function onDrop(e) {
  e.preventDefault();
  const targetId = parseInt(this.dataset.id);
  if (!dragSrcId || dragSrcId === targetId) return;

  // Reorder in DB
  const tx = db.transaction('photos', 'readonly');
  const allReq = tx.objectStore('photos').getAll();
  allReq.onsuccess = async () => {
    let photos = allReq.result
      .filter(p => p.interventionId === currentId)
      .sort((a, b) => (a.order || a.id) - (b.order || b.id));

    const srcIdx = photos.findIndex(p => p.id === dragSrcId);
    const tgtIdx = photos.findIndex(p => p.id === targetId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    const [moved] = photos.splice(srcIdx, 1);
    photos.splice(tgtIdx, 0, moved);

    // Write new orders
    const tx2 = db.transaction('photos', 'readwrite');
    const store = tx2.objectStore('photos');
    photos.forEach((p, i) => {
      p.order = i * 10;
      store.put(p);
    });
    tx2.oncomplete = () => loadPhotos(currentId);
  };
}

/* Touch drag for mobile */
let touchDragId = null, touchClone = null;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.photo-item');
  if (!card) return;
  touchDragId = parseInt(card.dataset.id);
  touchClone = card.cloneNode(true);
  touchClone.style.cssText = `position:fixed;opacity:0.7;pointer-events:none;z-index:9999;width:${card.offsetWidth}px;height:${card.offsetHeight}px;border-radius:12px;transition:none`;
  document.body.appendChild(touchClone);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!touchClone) return;
  const t = e.touches[0];
  touchClone.style.left = (t.clientX - touchClone.offsetWidth / 2) + 'px';
  touchClone.style.top = (t.clientY - touchClone.offsetHeight / 2) + 'px';
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touchClone || touchDragId === null) return;
  touchClone.remove(); touchClone = null;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const target = el && el.closest('.photo-item');
  if (target && parseInt(target.dataset.id) !== touchDragId) {
    const fakeEvent = { preventDefault: () => {}, dataTransfer: {} };
    const origSrc = dragSrcId;
    dragSrcId = touchDragId;
    onDrop.call(target, fakeEvent);
    dragSrcId = origSrc;
  }
  touchDragId = null;
});

/* ============================================================
   CAPTION / COMMENT MODAL
   ============================================================ */
function openCaptionModal(photo) {
  capturePhotoId = photo.id;
  document.getElementById('caption-img-preview').src = photo.data;
  document.getElementById('caption-name').value = photo.caption || '';
  document.getElementById('caption-comment').value = photo.comment || '';
  showModal('m-caption');
}

function saveCaption() {
  if (!capturePhotoId) return;
  const caption = document.getElementById('caption-name').value.trim();
  const comment = document.getElementById('caption-comment').value.trim();
  const tx = db.transaction('photos', 'readwrite');
  const store = tx.objectStore('photos');
  const req = store.get(capturePhotoId);
  req.onsuccess = () => {
    const photo = req.result;
    photo.caption = caption;
    photo.comment = comment;
    store.put(photo);
  };
  tx.oncomplete = () => {
    hideModals();
    loadPhotos(currentId);
    toast('✅ Commentaire enregistré');
    capturePhotoId = null;
  };
}

/* ============================================================
   DELETE PHOTO
   ============================================================ */
function deletePhoto(photoId) {
  if (!confirm('Supprimer cette photo ?')) return;
  const tx = db.transaction('photos', 'readwrite');
  tx.objectStore('photos').delete(photoId);
  tx.oncomplete = () => {
    const inv = interventions.find(i => i.id === currentId);
    inv.photoCount = Math.max(0, inv.photoCount - 1);
    save();
    loadPhotos(currentId);
    updateStorageInfo();
    toast('🗑 Photo supprimée');
  };
}

/* ============================================================
   EXPORT
   ============================================================ */
async function exportPhotos(mode, clearAfter) {
  const photos = await getPhotosForCurrent();
  if (!photos.length) { toast('⚠️ Aucune photo à exporter'); return; }
  const inv = interventions.find(i => i.id === currentId);

  if (mode === 'pdf') {
    await generatePDF(photos, inv);
  } else if (mode === 'drive') {
    await exportToDrive(photos, inv);
  } else {
    await generateZip(photos, inv, clearAfter);
  }
}

function getPhotosForCurrent() {
  return new Promise(resolve => {
    const tx = db.transaction('photos', 'readonly');
    const req = tx.objectStore('photos').getAll();
    req.onsuccess = () => {
      const photos = req.result
        .filter(p => p.interventionId === currentId)
        .sort((a, b) => (a.order || a.id) - (b.order || b.id));
      resolve(photos);
    };
  });
}

/* --- ZIP --- */
async function generateZip(photos, inv, clearAfter) {
  showProgress('Création du ZIP…', 10);
  const zip = new JSZip();
  const folderName = `${inv.num}_${inv.client}`.replace(/[^a-z0-9_\-]/gi, '_');
  const folder = zip.folder(folderName);

  // Add photos
  photos.forEach((p, i) => {
    setProgress(10 + Math.round((i / photos.length) * 60), `Ajout photo ${i+1}/${photos.length}…`);
    folder.file(p.name || `photo_${i+1}.jpg`, p.data.split(',')[1], { base64: true });
  });

  // Add manifest
  const manifest = photos.map((p, i) => `Photo ${i+1}: ${p.name}\nLégende: ${p.caption || '—'}\nCommentaire: ${p.comment || '—'}\n`).join('\n');
  folder.file('notes.txt', `Intervention: ${inv.num}\nClient: ${inv.client}\nDate: ${formatDate(inv.date)}\n\n` + manifest);

  setProgress(80, 'Compression…');
  const blob = await zip.generateAsync({ type: 'blob' });
  setProgress(100, 'Téléchargement…');
  downloadBlob(blob, `${folderName}.zip`);
  hideProgress();

  if (clearAfter && confirm(`ZIP téléchargé. Supprimer les ${photos.length} photos de l'app pour libérer de la place ?`)) {
    await clearPhotos(photos);
  }
  toast('✅ ZIP exporté');
}

/* --- PDF --- */
async function generatePDF(photos, inv) {
  showProgress('Génération du PDF…', 5);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const margin = 15;
  const usableW = W - margin * 2;

  // --- Cover page ---
  doc.setFillColor(12, 15, 22);
  doc.rect(0, 0, W, H, 'F');
  doc.setFillColor(255, 107, 43);
  doc.rect(0, 0, 6, H, 'F');
  doc.setTextColor(255, 107, 43);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.text('RAPPORT D\'INTERVENTION', margin + 4, 40);
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(26);
  doc.text(inv.client, margin + 4, 58, { maxWidth: usableW - 4 });
  doc.setFontSize(13);
  doc.setTextColor(180, 180, 180);
  doc.text(`N° ${inv.num}`, margin + 4, 72);
  doc.text(`Date : ${formatDate(inv.date)}`, margin + 4, 80);
  doc.text(`${photos.length} photo${photos.length > 1 ? 's' : ''}`, margin + 4, 88);
  doc.setFillColor(30, 35, 50);
  doc.rect(margin + 4, 110, usableW - 4, 0.4, 'F');
  doc.setFontSize(8);
  doc.setTextColor(120, 120, 120);
  doc.text('Généré par InterventionPro', margin + 4, 120);

  // --- Photo pages ---
  const photosPerPage = 2;
  const imgH = 75;
  const colW = (usableW - 8) / 2;

  for (let i = 0; i < photos.length; i++) {
    setProgress(10 + Math.round((i / photos.length) * 85), `Photo ${i+1}/${photos.length}…`);

    if (i % photosPerPage === 0) {
      doc.addPage();
      // Page header
      doc.setFillColor(12, 15, 22);
      doc.rect(0, 0, W, H, 'F');
      doc.setFillColor(255, 107, 43);
      doc.rect(0, 0, W, 10, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(7);
      doc.setFont('helvetica', 'bold');
      doc.text(`${inv.num} — ${inv.client}`, margin, 6.5);
      doc.text(`Page ${Math.floor(i / photosPerPage) + 2}`, W - margin, 6.5, { align: 'right' });
    }

    const col = i % 2;
    const row = Math.floor((i % photosPerPage) / 2);
    const x = margin + col * (colW + 8);
    const y = 20 + row * (imgH + 45);

    // Add image
    try {
      const imgData = photos[i].data;
      const fmt = imgData.startsWith('data:image/png') ? 'PNG' : 'JPEG';
      doc.addImage(imgData, fmt, x, y, colW, imgH, undefined, 'MEDIUM');
    } catch(err) {
      doc.setFillColor(30, 35, 50);
      doc.rect(x, y, colW, imgH, 'F');
    }

    // Caption & comment
    let ty = y + imgH + 5;
    const caption = photos[i].caption || `Photo ${i + 1}`;
    const comment = photos[i].comment || '';

    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(255, 107, 43);
    doc.text(caption, x, ty, { maxWidth: colW });
    ty += 5;

    if (comment) {
      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(180, 180, 180);
      const lines = doc.splitTextToSize(comment, colW);
      doc.text(lines.slice(0, 4), x, ty);
    }
  }

  setProgress(100, 'Téléchargement…');
  const folderName = `${inv.num}_${inv.client}`.replace(/[^a-z0-9_\-]/gi, '_');
  doc.save(`${folderName}.pdf`);
  hideProgress();
  toast('✅ PDF généré');
}

/* --- GOOGLE DRIVE --- */
function toggleGDrive() {
  if (gdriveConnected) {
    gdriveToken = null;
    gdriveConnected = false;
    document.getElementById('gdrive-btn').classList.remove('connected');
    document.getElementById('gdrive-label').textContent = 'Google Drive';
    toast('🔌 Déconnecté de Drive');
  } else {
    connectGDrive();
  }
}

function connectGDrive() {
  if (GDRIVE_CLIENT_ID === '510292526417-oodof4b1lvu2cr7tebjrm9iblce8n79r.apps.googleusercontent.com') {
    toast('⚠️ Configurez votre Client ID Google dans le code');
    alert('Pour activer Google Drive :\n1. Créez un projet sur console.cloud.google.com\n2. Activez l\'API Drive\n3. Créez des identifiants OAuth2 (web)\n4. Remplacez YOUR_GOOGLE_CLIENT_ID dans le code\n\nSans cela, l\'export ZIP & PDF fonctionnent normalement.');
    return;
  }
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: window.location.origin + window.location.pathname,
    response_type: 'token',
    scope: GDRIVE_SCOPE,
  });
  window.open(`https://accounts.google.com/o/oauth2/auth?${params}`, '_blank', 'width=500,height=600');

  // Listen for token via postMessage or hash
  const handler = (e) => {
    if (e.data && e.data.access_token) {
      gdriveToken = e.data.access_token;
      gdriveConnected = true;
      document.getElementById('gdrive-btn').classList.add('connected');
      document.getElementById('gdrive-label').textContent = 'Drive ✓';
      toast('✅ Connecté à Google Drive');
      window.removeEventListener('message', handler);
    }
  };
  window.addEventListener('message', handler);

  // Also check URL hash on page load for redirect flow
  const hash = new URLSearchParams(window.location.hash.substring(1));
  if (hash.get('access_token')) {
    gdriveToken = hash.get('access_token');
    gdriveConnected = true;
    document.getElementById('gdrive-btn').classList.add('connected');
    document.getElementById('gdrive-label').textContent = 'Drive ✓';
  }
}

// Handle OAuth2 redirect on page load
window.addEventListener('load', () => {
  const hash = new URLSearchParams(window.location.hash.substring(1));
  if (hash.get('access_token')) {
    gdriveToken = hash.get('access_token');
    gdriveConnected = true;
    document.getElementById('gdrive-btn').classList.add('connected');
    document.getElementById('gdrive-label').textContent = 'Drive ✓';
    toast('✅ Connecté à Google Drive');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
});

async function exportToDrive(photos, inv) {
  if (!gdriveConnected || !gdriveToken) {
    toast('⚠️ Connectez-vous à Google Drive d\'abord');
    connectGDrive();
    return;
  }
  showProgress('Export vers Drive…', 10);

  // Generate ZIP
  const zip = new JSZip();
  const folderName = `${inv.num}_${inv.client}`.replace(/[^a-z0-9_\-]/gi, '_');
  const folder = zip.folder(folderName);
  photos.forEach((p, i) => {
    folder.file(p.name || `photo_${i+1}.jpg`, p.data.split(',')[1], { base64: true });
  });
  const manifest = photos.map((p, i) => `Photo ${i+1}: ${p.name}\nLégende: ${p.caption || '—'}\nCommentaire: ${p.comment || '—'}\n`).join('\n');
  folder.file('notes.txt', `Intervention: ${inv.num}\nClient: ${inv.client}\nDate: ${formatDate(inv.date)}\n\n` + manifest);

  setProgress(40, 'Compression ZIP…');
  const blob = await zip.generateAsync({ type: 'blob' });
  setProgress(60, 'Upload vers Drive…');

  // Upload via Drive API
  const fileName = `${folderName}.zip`;
  const metadata = { name: fileName, mimeType: 'application/zip' };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);

  try {
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: `Bearer ${gdriveToken}` },
      body: form
    });
    if (res.ok) {
      setProgress(100, 'Envoyé !');
      hideProgress();
      toast('☁️ Fichier envoyé sur Google Drive !');
    } else {
      const err = await res.json();
      hideProgress();
      if (err.error && err.error.status === 'UNAUTHENTICATED') {
        gdriveConnected = false; gdriveToken = null;
        document.getElementById('gdrive-btn').classList.remove('connected');
        document.getElementById('gdrive-label').textContent = 'Google Drive';
        toast('🔑 Session expirée, reconnectez-vous');
      } else {
        toast('❌ Erreur Drive : ' + (err.error?.message || 'inconnue'));
      }
    }
  } catch(e) {
    hideProgress();
    toast('❌ Erreur réseau Drive');
  }
}

/* ============================================================
   CLEAR AFTER EXPORT
   ============================================================ */
function clearPhotos(photos) {
  return new Promise(resolve => {
    const tx = db.transaction('photos', 'readwrite');
    const store = tx.objectStore('photos');
    photos.forEach(p => store.delete(p.id));
    tx.oncomplete = () => {
      const inv = interventions.find(i => i.id === currentId);
      inv.photoCount = 0;
      save();
      loadPhotos(currentId);
      updateStorageInfo();
      toast('🗑 App vidée');
      resolve();
    };
  });
}

/* ============================================================
   INTERVENTIONS CRUD
   ============================================================ */
function createIntervention() {
  const num = document.getElementById('in-num').value.trim();
  const cli = document.getElementById('in-client').value.trim();
  if (!num || !cli) { toast('⚠️ Remplis le numéro et le client'); return; }
  const inv = { id: Date.now(), num, client: cli, photoCount: 0, date: new Date().toISOString() };
  interventions.push(inv);
  save();
  hideModals();
  document.getElementById('in-num').value = '';
  document.getElementById('in-client').value = '';
  renderList();
  openFolder(inv.id);
}

function renderList() {
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  if (!interventions.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--muted);font-size:0.9rem">Aucune intervention — créez-en une !</div>`;
    return;
  }
  interventions.slice().reverse().forEach(inv => {
    const div = document.createElement('div');
    div.className = 'int-card';
    div.onclick = () => openFolder(inv.id);
    div.innerHTML = `
      <div class="int-icon">📁</div>
      <div class="int-info">
        <div class="int-num">${escapeHTML(inv.num)}</div>
        <div class="int-name">${escapeHTML(inv.client)}</div>
        <div class="int-meta">${formatDate(inv.date)} · ${inv.photoCount} photo${inv.photoCount !== 1 ? 's' : ''}</div>
      </div>
      <div style="color:var(--muted);font-size:1.2rem">›</div>
    `;
    container.appendChild(div);
  });
}

function openFolder(id) {
  currentId = id;
  const inv = interventions.find(i => i.id === id);
  document.getElementById('d-num').textContent = inv.num;
  document.getElementById('d-title').textContent = inv.client;
  document.getElementById('d-date').textContent = `Créée le ${formatDate(inv.date)}`;
  document.getElementById('v-list').classList.remove('active');
  document.getElementById('v-detail').classList.add('active');
  loadPhotos(id);
  updateStorageInfo();
}

function goHome() {
  currentId = null;
  document.getElementById('v-detail').classList.remove('active');
  document.getElementById('v-list').classList.add('active');
  renderList();
}

/* ============================================================
   STORAGE INFO
   ============================================================ */
function updateStorageInfo() {
  if (!navigator.storage || !navigator.storage.estimate) return;
  navigator.storage.estimate().then(est => {
    const used = (est.usage / 1024 / 1024).toFixed(1);
    const quota = (est.quota / 1024 / 1024).toFixed(0);
    const pct = Math.min(100, ((est.usage / est.quota) * 100));
    document.getElementById('d-storage').textContent = `${used} Mo utilisés sur ${quota} Mo (${Math.round(pct)}%)`;
    document.getElementById('storage-fill').style.width = pct + '%';
    document.getElementById('storage-fill').style.background = pct > 80 ? 'var(--red)' : pct > 60 ? '#ffaa00' : 'var(--accent)';
  });
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHTML(str) {
  return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch { return '—'; }
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function save() { localStorage.setItem('ipro_v10', JSON.stringify(interventions)); }

function showModal(id) { document.getElementById(id).classList.add('open'); }
function hideModals() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }

// Close modals on backdrop click
document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) hideModals(); });
});

/* Toast */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* Progress */
function showProgress(title, pct) {
  document.getElementById('progress-title').textContent = title;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = '';
  document.getElementById('progress-overlay').classList.add('open');
}
function setProgress(pct, label) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label || '';
}
function hideProgress() {
  document.getElementById('progress-overlay').classList.remove('open');
}

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideModals();
});
</script>
